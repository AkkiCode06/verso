name: Verso
options:
  bundleIdPrefix: com.akki
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Verso:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Verso
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableCopyright: © 2026
        NSAppleEventsUsageDescription: Verso reads the currently playing track and its playback position from Music, so it can show lyrics in time with what you are listening to. Nothing leaves your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akki.verso
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"
